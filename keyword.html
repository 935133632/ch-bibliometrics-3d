<style>
/* Layout: full-bleed WebGL stage; quiet overlay panels pinned to the four corners. Single dark look by design. */
:root {
  --bg: #0c0e12;
  --bg-glow: #1d1416;
  --panel: rgba(18, 20, 25, 0.72);
  --line: rgba(236, 228, 214, 0.14);
  --fg: #ece4d6;
  --muted: #9a948b;
  --accent: #e2434f;
  --serif: "Newsreader", "Georgia", serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; background: radial-gradient(120% 90% at 55% 45%, var(--bg-glow) 0%, var(--bg) 62%); }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 18px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.head { max-width: 30rem; min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(24px, 3.4vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sub { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: auto; min-width: 0; max-width: 100%; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 3px; backdrop-filter: blur(6px); max-width: 100%; }
.seg span { font: 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 6px 10px; align-self: center; }
.seg button, .solo { font: 500 12px var(--sans); color: var(--fg); background: transparent; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.solo { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); }
.solo[aria-pressed="true"] { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.foot { align-items: flex-end; }
.legend { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); min-width: 0; max-width: min(100%, 28rem); pointer-events: auto; }
.legend h2 { font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.ramp { height: 8px; border-radius: 4px; width: min(240px, 70vw); }
.ticks { display: flex; justify-content: space-between; width: min(240px, 70vw); font: 11px var(--mono); color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
.chips i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.note { font: 11px/1.55 var(--mono); color: var(--muted); text-align: right; max-width: 20rem; margin: 0; }
.note b { color: var(--fg); font-weight: 500; }
.tag { position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap; font: 11px var(--mono); color: var(--fg);
  background: rgba(12, 14, 18, 0.66); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px 2px 5px; }
.tag i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
#tip { position: fixed; left: 0; top: 0; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; backdrop-filter: blur(8px); min-width: 170px; }
#tip strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 15px; margin-bottom: 4px; }
#tip dl { display: grid; grid-template-columns: auto auto; gap: 2px 12px; margin: 0; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
#tip dt { color: var(--muted); }
#tip dd { margin: 0; text-align: right; }
#fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (max-width: 640px) {
  .controls { align-items: flex-start; }
  .note { text-align: left; }
  .tag:nth-of-type(n+12) { display: none; }
}
</style>

terrain.position.y = Y_OFF; scene.add(terrain);
const ground = N.map((n, i) => rawH(xs[i], zs[i]) * hScale + Y_OFF);
const pTer = N.map((n, i) => new THREE.Vector3(xs[i], ground[i] + 5 + 11 * Math.sqrt(n.o / maxO), zs[i]));

/* ---------- burst: hub keyword at the centre ---------- */
const hub = N.reduce((b, n, i) => n.o > N[b].o ? i : b, 0);
const hubW = new Array(L).fill(0);
E.forEach(([a, b, w]) => { if (a === hub) hubW[b] = w; if (b === hub) hubW[a] = w; });
const maxHW = Math.max(...hubW);
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const pBurst = N.map((n, i) => {
  if (i === hub) return new THREE.Vector3(0, 0, 0);
  const d = pNet[i].clone().sub(pNet[hub]);
  d.z += (rnd() - 0.5) * 30;
  if (d.lengthSq() < 1e-6) d.set(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5);
  d.normalize();
  const dist = hubW[i] > 0 ? 14 + 66 * (1 - Math.sqrt(hubW[i] / maxHW)) : 92 + rnd() * 18;
  return d.multiplyScalar(dist);
});

/* ---------- nebula: compact star map wrapped in a density cloud ---------- */
const pNeb = pNet.map(p => new THREE.Vector3(p.x * 0.85, p.y * 0.85, p.z * 1.1));

/* ---------- glow sprite texture ---------- */
const glowTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,255,255,0.9)"); r.addColorStop(0.25, "rgba(255,255,255,0.35)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();

/* ---------- keyword spheres ---------- */
const sGeo = new THREE.SphereGeometry(1, 28, 18);
const balls = [], halos = [], cur = pNet.map(p => p.clone());
N.forEach((n, i) => {
  const r = 0.55 + 3.1 * Math.sqrt(n.o / maxO);
  const m = new THREE.Mesh(sGeo, new THREE.MeshStandardMaterial({ roughness: 0.32, metalness: 0.08, emissiveIntensity: 0.32 }));
  m.scale.setScalar(r); m.userData = { i, r }; scene.add(m); balls.push(m);
  const h = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.45 }));
  h.scale.setScalar(r * 4.2); scene.add(h); halos.push(h);
});

/* ---------- line layers ---------- */
function lineLayer(nSeg, additive) {
  const pos = new Float32Array(nSeg * 6), col = new Float32Array(nSeg * 6), geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending });
  scene.add(new THREE.LineSegments(geo, mat));
  return { pos, col, geo, mat };
}
const links = lineLayer(E.length, true);      // all co-occurrence links
const stems = lineLayer(L, false);            // terrain stems
const spokeIdx = N.map((n, i) => i).filter(i => hubW[i] > 0);
const spokes = lineLayer(spokeIdx.length, true);

/* ---------- dust and nebula cloud ---------- */
const dustGeo = new THREE.BufferGeometry(), dp = new Float32Array(900 * 3);
for (let i = 0; i < dp.length; i++) dp[i] = (rnd() - 0.5) * (i % 3 === 1 ? 170 : 280);
dustGeo.setAttribute("position", new THREE.BufferAttribute(dp, 3));
const dustMat = new THREE.PointsMaterial({ size: 0.7, color: 0xe9d9c6, transparent: true, opacity: 0, depthWrite: false });
scene.add(new THREE.Points(dustGeo, dustMat));

const CLOUD = 16000, cw = N.map(n => Math.pow(n.o, 0.8)), cwSum = cw.reduce((a, b) => a + b, 0);
const cPos = new Float32Array(CLOUD * 3), cCol = new Float32Array(CLOUD * 3);
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const warm = new THREE.Color("#f6c3a4"), cream = new THREE.Color("#f1e6dc"), haze = new THREE.Color("#8fa3b8");
for (let k = 0; k < CLOUD; k++) {
  let pick = rnd() * cwSum, i = 0; while (pick > cw[i] && i < L - 1) pick -= cw[i++];
  const sd = 5 + 9 * Math.sqrt(N[i].o / maxO) + rnd() * 6, gx = gauss(), gy = gauss(), gz = gauss();
  cPos.set([pNeb[i].x + gx * sd, pNeb[i].y + gy * sd, pNeb[i].z + gz * sd], k * 3);
  const spread = Math.min(1, Math.sqrt(gx * gx + gy * gy + gz * gz) / 2.6);
  const c = (N[i].o / maxO > 0.3 ? warm.clone().lerp(cream, spread) : cream.clone()).lerp(haze, spread * 0.8);
  c.toArray(cCol, k * 3);
}
const cloudGeo = new THREE.BufferGeometry();
cloudGeo.setAttribute("position", new THREE.BufferAttribute(cPos, 3));
cloudGeo.setAttribute("color", new THREE.BufferAttribute(cCol, 3));
const cloudMat = new THREE.PointsMaterial({ size: 7, map: glowTex, vertexColors: true, transparent: true, opacity: 0, depthWrite: false });
const cloud = new THREE.Points(cloudGeo, cloudMat); scene.add(cloud);

/* ---------- view definitions ---------- */
const VIEWS = {
  net: { pos: pNet, op: { links: 0.2, stems: 0, spokes: 0, terrain: 0, dust: 0.35, cloud: 0 }, hub: 1, cam: [0, 12, 128],
    title: T.noun + " Star Map",
    note: `<b>Depth</b> = ${T.depth}<br><b>Sphere size</b> = ${T.unit}<br>${T.layout}` },
  ter: { pos: pTer, op: { links: 0, stems: 0.55, spokes: 0, terrain: 1, dust: 0, cloud: 0 }, hub: 1, cam: [0, 78, 112],
    title: T.noun + " Terrain",
    note: `<b>Height</b> = density, weighted by ${T.unit}<br><b>Stem height</b> = ${T.unit}<br>${T.layout}` },
  burst: { pos: pBurst, op: { links: 0.03, stems: 0, spokes: 0.4, terrain: 0, dust: 0.35, cloud: 0 }, hub: 2.4, cam: [0, 10, 165],
    title: T.noun + " Burst",
    note: "", },
  neb: { pos: pNeb, op: { links: 0.3, stems: 0, spokes: 0, terrain: 0, dust: 0.12, cloud: 0.16 }, hub: 1, cam: [0, 6, 112],
    title: T.noun + " Nebula",
    note: `<b>Cloud density</b> = density, weighted by ${T.unit}<br><b>Filaments</b> = ${T.links}<br>${T.layout}` },
};
VIEWS.burst.note = `<b>Centre</b> = ${N[hub].l} (${N[hub].o.toLocaleString("en")} ${T.unit})<br><b>Distance</b> = ${T.burstNear}<br><b>Outer ring</b> = ${T.burstOuter}`;

let view = "net", trans = null;
const state = { op: { ...VIEWS.net.op }, hub: 1 };

/* ---------- paint / place ---------- */
const tags = {};
function paint() {
  N.forEach((n, i) => {
    const c = nodeColor(n);
    balls[i].material.color.copy(c); balls[i].material.emissive.copy(c); halos[i].material.color.copy(c);
    c.toArray(stems.col, i * 6); c.toArray(stems.col, i * 6 + 3);
    if (tags[i]) tags[i].firstChild.style.background = "#" + c.getHexString();
  });
  E.forEach(([a, b], k) => { nodeColor(N[a]).toArray(links.col, k * 6); nodeColor(N[b]).toArray(links.col, k * 6 + 3); });
  const hc = nodeColor(N[hub]);
  spokeIdx.forEach((i, k) => { hc.toArray(spokes.col, k * 6); new THREE.Color("#fff3ea").toArray(spokes.col, k * 6 + 3); });
  [links, stems, spokes].forEach(l => { l.geo.attributes.color.needsUpdate = true; });
  legend();
}
function place() {
  for (let i = 0; i < L; i++) {
    const s = balls[i].userData.r * (i === hub ? state.hub : 1);
    balls[i].position.copy(cur[i]); halos[i].position.copy(cur[i]);
    if (hovered !== balls[i]) balls[i].scale.setScalar(s);
    halos[i].scale.setScalar(s * 4.2);
    stems.pos.set([cur[i].x, ground[i], cur[i].z, cur[i].x, cur[i].y, cur[i].z], i * 6);
  }
  E.forEach(([a, b], k) => { links.pos.set([cur[a].x, cur[a].y, cur[a].z, cur[b].x, cur[b].y, cur[b].z], k * 6); });
  spokeIdx.forEach((i, k) => { spokes.pos.set([cur[hub].x, cur[hub].y, cur[hub].z, cur[i].x, cur[i].y, cur[i].z], k * 6); });
  [links, stems, spokes].forEach(l => { l.geo.attributes.position.needsUpdate = true; });
  links.mat.opacity = state.op.links; stems.mat.opacity = state.op.stems; spokes.mat.opacity = state.op.spokes;
  terrain.material.opacity = state.op.terrain; terrain.visible = state.op.terrain > 0.01; terrain.material.depthWrite = state.op.terrain > 0.95;
  dustMat.opacity = state.op.dust; cloudMat.opacity = state.op.cloud; cloud.visible = state.op.cloud > 0.002;
}

/* ---------- labels ---------- */
N.map((n, i) => i).sort((a, b) => N[b].o - N[a].o).slice(0, 22).forEach(i => {
  const el = document.createElement("div"); el.className = "tag";
  el.appendChild(document.createElement("i")); el.appendChild(document.createTextNode(N[i].l));
  $("tags").appendChild(el); tags[i] = el;
});

/* ---------- legend + notes ---------- */
function legend() {
  const lg = $("legend"); lg.textContent = "";
  const h = document.createElement("h2");
  if (colorMode === "yr") {
    h.textContent = T.yearTitle; lg.appendChild(h);
    const ramp = document.createElement("div"); ramp.className = "ramp";
    ramp.style.background = `linear-gradient(90deg, ${yearStops.map(([t, c]) => `${c} ${t * 100}%`).join(",")})`;
    const ticks = document.createElement("div"); ticks.className = "ticks";
    for (let y = YR0; y <= YR1; y += T.tickStep) { const s = document.createElement("span"); s.textContent = y; ticks.appendChild(s); }
    lg.append(ramp, ticks);
  } else {
    h.textContent = T.clusterTitle; lg.appendChild(h);
    const chips = document.createElement("div"); chips.className = "chips";
    Object.keys(D.clusters).sort((a, b) => a - b).forEach(c => {
      const s = document.createElement("span"), dot = document.createElement("i");
      dot.style.background = clusterHex[(c - 1) % clusterHex.length];
      s.append(dot, document.createTextNode(`${c} ${D.clusters[c]}`)); chips.appendChild(s);
    });
    lg.appendChild(chips);
  }
}
function note() { $("title").textContent = VIEWS[view].title; $("note").innerHTML = VIEWS[view].note; }

/* ---------- controls ---------- */
const easeIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function setView(v) {
  if (v === view && !trans) return;
  view = v;
  ["net", "ter", "burst", "neb"].forEach(k => $("v-" + k).setAttribute("aria-pressed", k === v));
  trans = { from: cur.map(p => p.clone()), op: { ...state.op }, hub: state.hub, cam: camera.position.clone(),
    target: controls.target.clone(), start: performance.now(), dur: reduce ? 1 : 1600 };
  note();
}
function setColor(m) {
  colorMode = m; $("c-yr").setAttribute("aria-pressed", m === "yr"); $("c-cl").setAttribute("aria-pressed", m === "cl"); paint();
}
["net", "ter", "burst", "neb"].forEach(k => { $("v-" + k).onclick = () => setView(k); });
$("c-yr").onclick = () => setColor("yr"); $("c-cl").onclick = () => setColor("cl");
$("spin").onclick = e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.setAttribute("aria-pressed", controls.autoRotate); };

/* ---------- hover / tap ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let hovered = null;
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(balls)[0];
  if (hovered) hovered.material.emissiveIntensity = 0.32;
  hovered = hit ? hit.object : null;
  const tip = $("tip");
  if (!hovered) { tip.hidden = true; return; }
  const i = hovered.userData.i, n = N[i];
  hovered.material.emissiveIntensity = 0.75;
  hovered.scale.setScalar(hovered.userData.r * (i === hub ? state.hub : 1) * 1.3);
  tip.textContent = "";
  const s = document.createElement("strong"); s.textContent = n.l;
  const dl = document.createElement("dl");
  const rows = [[T.unitCap, n.o.toLocaleString("en")], [T.yearShort, n.yr.toFixed(T.yrDigits)], ["Cluster", `${n.c} · ${D.clusters[n.c]}`]];
  if (n.src) rows.unshift(["Source", n.src]);
  if (i !== hub) rows.push([T.withCentre, hubW[i]]);
  rows.forEach(([k, v]) => { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); });
  tip.append(s, dl); tip.hidden = false;
  const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.transform = `translate(${x}px, ${y}px)`;
}
renderer.domElement.addEventListener("pointermove", pick);
renderer.domElement.addEventListener("pointerdown", pick);
renderer.domElement.addEventListener("pointerleave", () => { $("tip").hidden = true; });

/* ---------- loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < 640 ? 62 : 45; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
const v3 = new THREE.Vector3(), origin = new THREE.Vector3();
function frame(now) {
  if (trans) {
    const k = Math.min(1, (now - trans.start) / trans.dur), e = easeIO(k), V = VIEWS[view];
    for (let i = 0; i < L; i++) cur[i].lerpVectors(trans.from[i], V.pos[i], e);
    for (const key in state.op) state.op[key] = trans.op[key] + (V.op[key] - trans.op[key]) * e;
    state.hub = trans.hub + (V.hub - trans.hub) * e;
    camera.position.lerpVectors(trans.cam, v3.set(...V.cam), e);
    controls.target.lerpVectors(trans.target, origin, e);
    if (k >= 1) trans = null;
  }
  place();
  controls.update();
  renderer.render(scene, camera);
  for (const i in tags) {
    v3.copy(cur[i]).project(camera);
    const el = tags[i];
    if (v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05) { el.style.visibility = "hidden"; continue; }
    el.style.visibility = "visible";
    el.style.transform = `translate(${(v3.x + 1) / 2 * innerWidth + 10}px, ${(1 - v3.y) / 2 * innerHeight}px) translateY(-50%)`;
  }
  requestAnimationFrame(frame);
}
paint(); note(); place();
requestAnimationFrame(frame);
</script>
