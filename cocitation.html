<style>
/* Layout: full-bleed WebGL stage; quiet overlay panels pinned to the four corners. Single dark look by design. */
:root {
  --bg: #0c0e12;
  --bg-glow: #1d1416;
  --panel: rgba(18, 20, 25, 0.72);
  --line: rgba(236, 228, 214, 0.14);
  --fg: #ece4d6;
  --muted: #9a948b;
  --accent: #e2434f;
  --serif: "Newsreader", "Georgia", serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; background: radial-gradient(120% 90% at 55% 45%, var(--bg-glow) 0%, var(--bg) 62%); }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 18px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.head { max-width: 30rem; min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(24px, 3.4vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sub { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: auto; min-width: 0; max-width: 100%; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 3px; backdrop-filter: blur(6px); max-width: 100%; }
.seg span { font: 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 6px 10px; align-self: center; }
.seg button, .solo { font: 500 12px var(--sans); color: var(--fg); background: transparent; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.solo { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); }
.solo[aria-pressed="true"] { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.foot { align-items: flex-end; }
.legend { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); min-width: 0; max-width: min(100%, 28rem); pointer-events: auto; }
.legend h2 { font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.ramp { height: 8px; border-radius: 4px; width: min(240px, 70vw); }
.ticks { display: flex; justify-content: space-between; width: min(240px, 70vw); font: 11px var(--mono); color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
.chips i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.note { font: 11px/1.55 var(--mono); color: var(--muted); text-align: right; max-width: 20rem; margin: 0; }
.note b { color: var(--fg); font-weight: 500; }
.tag { position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap; font: 11px var(--mono); color: var(--fg);
  background: rgba(12, 14, 18, 0.66); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px 2px 5px; }
.tag i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
#tip { position: fixed; left: 0; top: 0; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; backdrop-filter: blur(8px); min-width: 170px; }
#tip strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 15px; margin-bottom: 4px; }
#tip dl { display: grid; grid-template-columns: auto auto; gap: 2px 12px; margin: 0; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
#tip dt { color: var(--muted); }
#tip dd { margin: 0; text-align: right; }
#fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (max-width: 640px) {
  .controls { align-items: flex-start; }
  .note { text-align: left; }
  .tag:nth-of-type(n+12) { display: none; }
}
</style>

function note() { $("title").textContent = VIEWS[view].title; $("note").innerHTML = VIEWS[view].note; }

/* ---------- controls ---------- */
const easeIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function setView(v) {

  trans = { from: cur.map(p => p.clone()), op: { ...state.op }, hub: state.hub, cam: camera.position.clone(),

}

}
["net", "ter", "burst", "neb"].forEach(k => { $("v-" + k).onclick = () => setView(k); });
$("c-yr").onclick = () => setColor("yr"); $("c-cl").onclick = () => setColor("cl");

/* ---------- hover / tap ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let hovered = null;

  hovered.scale.setScalar(hovered.userData.r * (i === hub ? state.hub : 1) * 1.3);
  tip.textContent = "";
  const s = document.createElement("strong"); s.textContent = n.l;
  const dl = document.createElement("dl");
  const rows = [[T.unitCap, n.o.toLocaleString("en")], [T.yearShort, n.yr.toFixed(T.yrDigits)], ["Cluster", `${n.c} · ${D.clusters[n.c]}`]];
  if (n.src) rows.unshift(["Source", n.src]);
  if (i !== hub) rows.push([T.withCentre, hubW[i]]);
  rows.forEach(([k, v]) => { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); });
  tip.append(s, dl); tip.hidden = false;

renderer.domElement.addEventListener("pointermove", pick);
renderer.domElement.addEventListener("pointerdown", pick);

/* ---------- loop ---------- */
function resize() {

addEventListener("resize", resize); resize();
const v3 = new THREE.Vector3(), origin = new THREE.Vector3();

    for (let i = 0; i < L; i++) cur[i].lerpVectors(trans.from[i], V.pos[i], e);
    for (const key in state.op) state.op[key] = trans.op[key] + (V.op[key] - trans.op[key]) * e;
    state.hub = trans.hub + (V.hub - trans.hub) * e;

    el.style.visibility = "visible";
    el.style.transform = `translate(${(v3.x + 1) / 2 * innerWidth + 10}px, ${(1 - v3.y) / 2 * innerHeight}px) translateY(-50%)`;
